name: Reusable Level 5 merge gate

on:
  workflow_call:
    inputs:
      workflow_ref:
        description: "Pinned reusable workflow repository ref"
        required: false
        type: string
        default: v1.5.0

permissions:
  issues: read
  contents: read
  pull-requests: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          path: consumer

      - uses: actions/checkout@v4
        with:
          repository: andreaspawlik/agentic-engineering-workflows
          ref: ${{ inputs.workflow_ref }}
          path: workflow

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate coordinator state
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER_INPUT: ${{ github.event.pull_request.number }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$PR_NUMBER_INPUT"
          if [ -z "$pr_number" ] && [ -n "$WORKFLOW_SHA" ]; then
            pr_number="$(gh pr list --state all --limit 100 --json number,headRefOid --jq '.' | PYTHONPATH=../workflow/templates/scripts python -c 'import json, os, sys; from coordinator import find_pr_by_sha; pr=find_pr_by_sha(json.load(sys.stdin), os.environ["WORKFLOW_SHA"]); print(pr["number"] if pr else "")')"
          fi
          test -n "$pr_number" || { echo "No PR associated with event; gate skipped."; exit 0; }
          issue_number="$(gh pr view "$pr_number" --json body --jq .body | PYTHONPATH=../workflow/templates/scripts python -c 'import sys; from coordinator import linked_issue_number; print(linked_issue_number(sys.stdin.read()) or "")')"
          test -n "$issue_number" || { echo "PR has no linked issue; gate skipped."; exit 0; }
          gh issue view "$issue_number" --json comments > /tmp/comments.json
          state="$(python ../workflow/templates/scripts/coordinator.py latest-state /tmp/comments.json "$issue_number")"
          test "$state" != "null" || { echo "No coordinator state; gate skipped."; exit 0; }
          printf '%s' "$state" > /tmp/state.json
          python ../workflow/templates/scripts/merge_gate.py /tmp/state.json "$pr_number"
