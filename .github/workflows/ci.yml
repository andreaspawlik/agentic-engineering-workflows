name: Reusable CI

on:
  workflow_call:
    inputs:
      workflow_ref:
        description: "Pinned reusable workflow repository ref"
        required: false
        type: string
        default: v1.1.0
      python_version:
        description: "Python version used by the consumer"
        required: false
        type: string
        default: "3.12"
    permissions:
      contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: consumer

      - uses: actions/checkout@v4
        with:
          repository: andreaspawlik/agentic-engineering-workflows
          ref: ${{ inputs.workflow_ref }}
          path: workflow

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install consumer dependencies
        working-directory: consumer
        run: python ../workflow/templates/scripts/project_config.py run project.install_command

      - name: Run configured tests and coverage
        working-directory: consumer
        run: python ../workflow/templates/scripts/project_config.py run project.coverage_command

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: consumer/coverage.xml
